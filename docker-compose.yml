services:
  minecraft:
    image: ${MINECRAFT_IMAGE}
    stdin_open: true
    tty: true
    environment:
      - EULA=TRUE
      - JAVA_MIN_MEMORY=4G
      - JAVA_MAX_MEMORY=4G
      - SERVER_JAR=/opt/minecraft/server.jar
    ports:
      - 25565:25565/tcp
    volumes:
      - ${MINECRAFT_DATA}:/data
    restart: always
